    // 가벼운 피드백 비프음 (Web Audio API)
    function playBeep(frequency = 580, duration = 0.08) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        // 무시
      }
    }

    // 나라 선택 카드 목록 생성
    function renderCountryCards() {
      const container = document.getElementById("countryGrid");
      container.innerHTML = "";

      countriesData.forEach((c) => {
        const card = document.createElement("div");
        card.className = `custom-bounce bg-white rounded-3xl p-4 sm:p-5 shadow-md hover:shadow-xl border-2 ${c.borderTheme} cursor-pointer transition-all flex flex-col items-center text-center relative group overflow-hidden`;
        card.onclick = () => selectCountry(c.id);

        card.innerHTML = `
          <div class="absolute -top-6 -right-6 w-16 h-16 bg-gradient-to-br ${c.bgTheme} rounded-full opacity-60"></div>
          <span class="text-5xl sm:text-6xl my-2 filter drop-shadow transition-transform group-hover:scale-110 duration-200">
            ${c.flag}
          </span>
          <span class="${c.tagColor} text-xs font-bold px-2 py-0.5 rounded-full mb-1">
            ${c.continent}
          </span>
          <h3 class="text-xl sm:text-2xl font-jua text-slate-800 mb-1">
            ${c.name}
          </h3>
          <p class="text-xs text-slate-500 font-medium mb-3">
            ${c.greeting}
          </p>
          <div class="w-full bg-amber-50 group-hover:bg-amber-400 group-hover:text-amber-950 text-amber-800 font-jua text-xs sm:text-sm py-2 px-3 rounded-xl transition-colors flex items-center justify-center gap-1">
            <span>의·식·주 탐험하기</span>
            <span>👉</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 특정 나라 선택 시 의식주 상세 페이지로 전환
    function selectCountry(countryId) {
      playBeep(520, 0.09);
      const country = countriesData.find((c) => c.id === countryId);
      if (!country) return;

      currentCountry = country;

      // 상단 기본 정보 반영
      document.getElementById("detailFlag").innerText = country.flag;
      document.getElementById("bgFlagEmoji").innerText = country.flag;
      document.getElementById("detailContinent").innerText = country.continent;
      document.getElementById("detailCountryName").innerText = country.name;
      document.getElementById("detailGreeting").innerText = `인사말: ${country.greeting}`;
      document.getElementById("cultureCount").innerText = country.cultures.length;

      // 의·식·주 리스트 렌더링 (한 줄씩 명확하게 구성)
      const listContainer = document.getElementById("cultureList");
      listContainer.innerHTML = "";

      country.cultures.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "flex flex-col sm:flex-row sm:items-start gap-3 p-3.5 sm:p-4 rounded-2xl bg-amber-50/70 border border-amber-200 hover:bg-amber-100/70 transition shadow-sm";
        
        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-[170px] sm:min-w-[210px] pt-0.5">
            <span class="w-7 h-7 rounded-full bg-amber-200 text-amber-900 font-jua flex items-center justify-center text-xs font-bold shadow-inner shrink-0">
              ${index + 1}
            </span>
            <span class="text-3xl shrink-0">${item.icon}</span>
            <div class="flex flex-col">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border inline-block w-fit ${item.badgeColor}">
                ${item.category}
              </span>
              <strong class="font-jua text-base sm:text-lg text-slate-800 leading-snug mt-0.5">${item.title}</strong>
            </div>
          </div>
          <div class="flex-grow pl-10 sm:pl-2">
            <p class="text-sm sm:text-base text-slate-700 font-medium leading-relaxed">
              ${item.desc}
            </p>
          </div>
        `;
        listContainer.appendChild(row);
      });

      // 뷰 전환
      document.getElementById("countrySelectionView").classList.add("hidden");
      document.getElementById("cultureDetailView").classList.remove("hidden");

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 첫 화면(홈)으로 이동하기
    function goHome() {

      currentCountry = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 초기 실행
    window.addEventListener("DOMContentLoaded", () => {
      renderCountryCards();
    });
